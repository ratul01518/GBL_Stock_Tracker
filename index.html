<!-- index.html (GBL Stock Tracker Production File) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBL Stock Tracker - Globe Biotech Limited</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
    .watermark-stamp {
      border: 3px double #7c3aed;
      color: #7c3aed;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      transform: rotate(-12deg);
      border-radius: 8px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
  <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50 no-print">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
      <div class="flex items-center space-x-3 w-full md:w-auto justify-between">
        <div class="flex items-center space-x-3">
          <div class="bg-white p-2 rounded-lg text-blue-900 font-extrabold text-xl tracking-wider">GBL</div>
          <div>
            <h1 class="font-bold text-lg leading-tight">Stock Tracker</h1>
            <p class="text-xs text-blue-200">Globe Biotech Limited (Tizma Brand)</p>
          </div>
        </div>
      </div>
      <div class="w-full md:max-w-md relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="globalSearchInput" oninput="handleGlobalSearch()" placeholder="Search Batch, Strength, Status, Invoice, Code..." class="w-full pl-9 pr-8 py-2 rounded-lg text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
      </div>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    <p class="text-center text-slate-600">GBL Stock Tracker Ready in Canvas Window.</p>
  </main>
</body>
</html>
